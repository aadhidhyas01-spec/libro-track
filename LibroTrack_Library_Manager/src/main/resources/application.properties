spring.application.name=LibroTrack

# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/librotrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Library rules
librotrack.loan-days=14
librotrack.fine-per-day=5.0
